<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .outerDiv{
      height: 550px;
      width: 1000px;
      border: 2px solid gray;
      border-radius: 12px;
      margin: 100px auto;
    }
    .counterHeading{
      padding-top: 20px;
      height: 60px;
      padding-left: 20px;
    }
    .textareaSec{
      height: 130px;
      width: 950px;
      margin-left: 25px;
      margin-top: 30px;
    }
    textarea{
      height: 120px;
      width: 950px;
      resize: none;
      border: 2px solid gray;
      border-radius: 8px;
      padding-left: 7px;
      font-size: 21px;
    }
    .livePrev{
      height: 100px;
      width: 950px;
      margin-left: 25px;
    }
    .remaining{
      height: 50px;
      width: 950px;
      margin-left: 25px;
      display: flex;
      align-items: end;
      justify-content: space-between;
    }
    .rightDiv{
      background-color: rgb(88, 129, 88);
      border-radius: 12px;
    }
    .rightDiv h2{
      font-size: 20px;
    }
    .leftDiv h2{
      font-size: 17px;
    }

    .progressbar{
      height: 10px;
      width: 950px;
      border: none;
      border-radius: 8px;
      margin-left: 25px;
      background-color: gray;
      margin-top: 30px;
    }
    .buttonDiv{
      margin-top: 30px;
    }
    button{
      height: 50px;
      width: 950px;
      margin-left: 25px;
      border: 1px solid gray;
      border-radius: 12px;
      background-color: black;
      font-size: 20px;
      cursor: pointer;
    }
    .mess{
      font-size: 23px;
    }
  </style>
</head>

<body>
  <div class="outerDiv">
    <div class="counterHeading">
      <h1>Character Counter</h1>
    </div>
    <div class="textareaSec">
      <textarea name="" id="text" maxlength="100" placeholder="Enter message...."></textarea>
    </div>

    <div class="livePrev">
      <p class="mess"></p>
    </div>

    <div class="remaining">
      <div class="leftDiv">
        <h2 class="charRemain"> 50 Character remaining</h2>
      </div>
      <div class="rightDiv">
        <h2 class="byFifty">0/100</h2>
      </div>
    </div>
    <div class="progressbar">

    </div>
    <div class="buttonDiv">
      <button class="btn">Clear message</button>
    </div>
  </div>

  <script>
    let text=document.querySelector('#text');
    let mess=document.querySelector('.mess');

    let charRemain=document.querySelector('.charRemain');
    let byFifty=document.querySelector('.byFifty');

    let progressbar=document.querySelector('.progressbar');

    let clearBtn=document.querySelector('.btn');

    let currentValue=0;

    let remainChar=100;

    let percentageWidth=0;

    text.addEventListener('input',()=>{
      mess.innerHTML=text.value;
      percentageWidth=text.value.length;
      remainChar=100-text.value.length;
      progressbar.style.background=` linear-gradient(to right, green ${percentageWidth}%, white ${percentageWidth}%)`;
      charRemain.innerHTML=`${remainChar} character remaining `;
      byFifty.innerHTML=`${text.value.length}/100`

      if(remainChar===0){
        alert('make sure write is less that 100 characters')
      }
    })

    clearBtn.addEventListener('click',()=>{
      text.value='';
      mess.innerHTML='';
      remainChar=100;
      charRemain.innerHTML=`${remainChar} character remaining `;
      progressbar.style.background=` linear-gradient(to right, green ${0}%, white ${0}%)`;
      byFifty.innerHTML=`${0}/100`
    })
  </script>
</body>
</html>
