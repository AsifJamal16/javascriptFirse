<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: black;
      color: whitesmoke;
    }
    .mainSection{
      height: 200px;
      width: 500px;
      margin: 140px auto;
      border: 2px solid gray;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    h1{
      font-size: 80px;
    }
  </style>
</head>
<body>
  <div class="mainSection">
    <h1></h1>
  </div>
  <script>
    let h1=document.querySelector('h1');
    let interval=setInterval(()=>{
      let now=new Date();
      now=now.toLocaleTimeString();
      h1.innerText=now;
    },1000)
  </script>
</body>
</html>
